<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইউটিউব ভিডিও ডাউনলোডার</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        h2 {
            color: #e62117;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .input-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #e62117;
        }

        button {
            padding: 12px 18px;
            background-color: #e62117;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #cc1810;
        }

        iframe {
            width: 100%;
            height: 60px;
            border: none;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>YouTube Downloader</h2>
    <p>লিংক দিন এবং এক ক্লিকেই ডাউনলোড করুন</p>
    
    <div class="input-box">
        <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
        <button onclick="getDownloadLink()">Download</button>
    </div>

    <!-- সেফ ডাউনলোড বাটন ফ্রেম -->
    <iframe id="downloadFrame" src=""></iframe>
</div>

<script>
    function getDownloadLink() {
        const urlInput = document.getElementById('videoUrl').value.trim();
        const frame = document.getElementById('downloadFrame');

        if (!urlInput) {
            alert('দয়া করে একটি সঠিক ইউটিউব ভিডিও লিংক দিন!');
            return;
        }

        // YouTube Video ID বের করা
        let videoId = "";
        if (urlInput.includes("v=")) {
            videoId = urlInput.split("v=")[1].split("&")[0];
        } else if (urlInput.includes("youtu.be/")) {
            videoId = urlInput.split("youtu.be/")[1].split("?")[0];
        }

        if (!videoId) {
            alert('সঠিক ইউটিউব লিংক পাওয়া যায়নি!');
            return;
        }

        // সরাসরি রেডিমেড ডাউনলোডার উইজেট লোড করবে
        frame.src = `https://loader.to/api/card/?url=https://www.youtube.com/watch?v=${videoId}`;
        frame.style.display = 'block';
    }
</script>

</body>
</html>
