<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi YouTube Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h2 {
            color: #e62117;
            margin-bottom: 8px;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .input-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #e62117;
        }

        button {
            padding: 12px 18px;
            background-color: #e62117;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #cc1810;
        }

        .video-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        .video-item {
            border: 1px solid #e1e1e1;
            border-radius: 8px;
            padding: 10px;
            background: #fafafa;
        }

        iframe {
            width: 100%;
            height: 280px;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Multi YouTube Downloader</h2>
    <p>লিংক দিন এবং একের পর এক ভিডিও যুক্ত করে ডাউনলোড করুন</p>
    
    <div class="input-box">
        <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
        <button onclick="addVideo()">Add to List</button>
    </div>

    <div id="videoList" class="video-list"></div>
</div>

<script>
    function addVideo() {
        const urlInput = document.getElementById('videoUrl');
        const url = urlInput.value.trim();
        const videoList = document.getElementById('videoList');

        if (!url) {
            alert('দয়া করে একটি সঠিক লিঙ্ক দিন!');
            return;
        }

        let videoId = "";
        if (url.includes("v=")) {
            videoId = url.split("v=")[1].split("&")[0];
        } else if (url.includes("youtu.be/")) {
            videoId = url.split("youtu.be/")[1].split("?")[0];
        }

        if (!videoId) {
            alert('সঠিক ইউটিউব লিংক পাওয়া যায়নি!');
            return;
        }

        // কার্ড এলিমেন্ট তৈরি
        const item = document.createElement('div');
        item.className = 'video-item';

        const iframe = document.createElement('iframe');
        iframe.src = `https://loader.to/api/card/?url=https://www.youtube.com/watch?v=${videoId}`;

        item.appendChild(iframe);
        videoList.prepend(item);

        urlInput.value = '';
    }
</script>

</body>
</html>
